name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python 3.14)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Pytest (hard gate)
        run: python -m pytest -q

      - name: Ruff (report-only; 337 findings on baseline, hard gate deferred)
        run: ruff check . || echo "RUFF_REPORT_ONLY_EXIT=$?"

      - name: Mypy (report-only; 25 errors in 6 files on baseline, hard gate deferred)
        run: mypy . || echo "MYPY_REPORT_ONLY_EXIT=$?"
